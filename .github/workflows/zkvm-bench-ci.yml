name: zkvm-bench-build-image

on:
  push:
    branches: [ "gpu/*", "cpu/*" ]
  pull_request:
    branches: [ "gpu/*", "cpu/*" ]
  workflow_dispatch:
    inputs:
      prover:
        required: true
        type: choice
        options:
          - gpu
          - cpu
        default: cpu

env:
  MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  PROVER: ${{ (equals(github.event.inputs.prover, 'gpu') || startsWith(github.ref_name, 'gpu/')) && 'gpu' || 'cpu' }}
  IMAGE_TAG: pkondratas/zkvm-${{ (equals(github.event.inputs.prover, 'gpu') || startsWith(github.ref_name, 'gpu/')) && 'gpu' || 'cpu' }}-bench:latest

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout branch
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Check if Dockerfile modified
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          docker:
            - Dockerfile.*

    - name: Login to Docker Hub
      if: steps.changes.outputs.docker == 'true' || env.MANUAL_RUN == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      if: steps.changes.outputs.docker == 'true' || env.MANUAL_RUN == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      if: steps.changes.outputs.docker == 'true' || env.MANUAL_RUN == 'true'
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ env.IMAGE_TAG }}
        file: ./Dockerfile.${{ env.PROVER }}