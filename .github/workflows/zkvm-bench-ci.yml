name: zkvm-bench-ci

on:
  push:
    branches: [ "gpu-proving", "cpu-proving" ]
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: choice
        options:
          - gpu-proving
          - cpu-proving
        default: "cpu-proving"
      cd:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  PROVER: ${{ github.ref_name == 'gpu-proving' && 'gpu' || 'cpu'}}
  IMAGE_TAG: pkondratas/zkvm-${{ github.ref_name == 'gpu-proving' && 'gpu' || 'cpu'}}-bench:latest

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout branch
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ env.IMAGE_TAG }}
        file: ./Dockerfile.${{ env.PROVER }}

    - name: Deploy
      if: ${{ inputs.cd == true }}
      uses: ./.github/workflows/zkvm-bench-cd.yml
      with:
        tag: ${{ env.IMAGE_TAG }}  