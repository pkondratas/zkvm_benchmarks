name: zkvm-bench-build-image

on:
  push:
    branches: [ "gpu/*", "cpu/*" ]
  pull_request:
    branches: [ "gpu/*", "cpu/*" ]
  workflow_dispatch:
    inputs:
      prover:
        required: true
        type: choice
        options:
          - gpu
          - cpu
        default: cpu

env:
  PROVER: ${{ (github.event.inputs.prover == 'gpu' || startsWith(github.ref_name, 'gpu/')) && 'gpu' || 'cpu' }}
  IMAGE_TAG: pkondratas/zkvm-${{ (github.event.inputs.prover == 'gpu' || startsWith(github.ref_name, 'gpu/')) && 'gpu' || 'cpu' }}-bench:latest

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}
        submodules: recursive

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ env.IMAGE_TAG }}
        file: ./Dockerfile.${{ env.PROVER }}